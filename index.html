<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Trading Card Game</h1>
    <div id="pack-opener" class="pack">
        <div class="pack-front">
            <p>Click to Open</p>
        </div>
    </div>
    <div id="card-container"></div>
    <button id="open-another-pack-btn">Open Another Pack</button>
    <div id="gallery-container">
        <h2>My Collection</h2>
        <div id="gallery"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
