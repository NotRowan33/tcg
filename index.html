<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="settings-btn">⚙️</button>
    <h1>Trading Card Game</h1>
    <div id="pack-opener" class="pack">
        <div class="pack-front">
            <p>Click to Open</p>
        </div>
    </div>
    <div id="card-container"></div>
    <button id="open-another-pack-btn">Return to Menu</button>
    <button id="open-collection-btn">My Collection</button>
    <button id="deck-builder-btn">Deck Builder</button>
    <button id="battle-btn">Battle!</button>
    <div id="collection-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>My Collection</h2>
            <div id="gallery"></div>
        </div>
    </div>
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Settings</h2>
            <div id="theme-switcher">
                <h3>Color Theme</h3>
                <button class="theme-btn" data-theme="green">Green</button>
                <button class="theme-btn" data-theme="blue">Blue</button>
                <button class="theme-btn" data-theme="red">Red</button>
            </div>
            <div id="reset-progress">
                <h3>Reset Progress</h3>
                <button id="reset-btn" class="danger-btn">Reset</button>
                <div id="reset-confirmation" class="hidden">
                    <p>Are you sure you want to reset all your progress?</p>
                    <button id="reset-yes-btn" class="danger-btn">Yes</button>
                    <button id="reset-no-btn">No</button>
                </div>
            </div>
        </div>
    </div>
    <div id="deck-builder-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Deck Builder</h2>
            <div class="deck-builder-container">
                <div id="deck-builder-collection" class="deck-panel">
                    <h3>Your Collection</h3>
                    <div class="card-list"></div>
                </div>
                <div id="deck-builder-deck" class="deck-panel">
                    <h3>Your Deck (<span id="deck-count">0</span>/20)</h3>
                    <div class="card-list"></div>
                </div>
            </div>
            <button id="save-deck-btn">Save Deck</button>
        </div>
    </div>
    <div id="battle-screen">
        <div id="opponent-zone" class="player-zone">
            <div class="hand-container"></div>
            <div class="bench-container"></div>
            <div class="player-info">
                <div class="deck-info">Deck: <span id="opponent-deck-count">20</span></div>
                <div class="health-info">Health: <span id="opponent-health">100</span></div>
            </div>
        </div>

        <div id="game-info-bar">
            <span id="turn-indicator">Player's Turn</span>
            <button id="end-turn-btn">End Turn</button>
        </div>

        <div id="player-zone" class="player-zone">
            <div class="player-info">
                <div class="deck-info">Deck: <span id="player-deck-count">20</span></div>
                <div class="health-info">Health: <span id="player-health">100</span></div>
            </div>
            <div class="bench-container"></div>
            <div class="hand-container"></div>
        </div>
    </div>
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2 id="game-over-message"></h2>
            <button id="game-over-ok-btn">OK</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
